# Operating points picked on each corpus's TRAIN split (metric H, delay 2, best F1) by
# scripts/eval/eval_*.py. Never tuned on test. alpha is the bad-set tail mass,
# kappa the posterior cutoff of the live/lag event channels.
breakfast:
  dish-given:
    hindsight:
      alpha: 0.02
      kappa: null
    live_L0:
      alpha: 0.02
      kappa: 0.1
    live_L5:
      alpha: 0.02
      kappa: 0.1
    live_Linf:
      alpha: 0.02
      kappa: 0.02
  dish-inferred:
    hindsight:
      alpha: 0.02
      kappa: null
    live_L0:
      alpha: 0.02
      kappa: 0.3
    live_L5:
      alpha: 0.02
      kappa: 0.3
    live_Linf:
      alpha: 0.02
      kappa: 0.3
  lexhard:
    hindsight:
      alpha: 0.05
      kappa: null
    live_L0:
      alpha: 0.007
      kappa: 0.02
    live_L5:
      alpha: 0.007
      kappa: 0.02
    live_Linf:
      alpha: 0.015
      kappa: 0.02
epic_tent:
  joint_params_clean:
    hindsight:
      alpha: 0.005
      s_temporal: 1.0e-05
      kappa: null
    live:
      alpha: 0.005
      s_temporal: 1.0e-05
      kappa: 0.5
