tick_seconds: 1.0

vocab:
  verbs: 15   # 14 real verbs + "stall" (SIL)
  nouns: 36   # 35 real nouns + "kitchen" (SIL)

k_subtask: 64   # weak-limit nominal; covers 48 actions + 1 SIL/"stall" state + headroom
k_recipe: 16    # weak-limit nominal; covers 10 known recipes + headroom

prior:
  alpha_pi: 1.0            # recipe Dirichlet concentration (weak-limit: keep small)

duration:
  d_max_ticks: 200   # ~p99 of segment lengths at 1s ticks; longer segments right-censor into the last bin
  shrinkage_kappa: 5.0     # global-shape pseudocount for per-(Z,R) NB fitting (docs/training.md §5)

em:
  chunk_size: 8   # trials per E-step chunk; the joint chunk is max(1, chunk_size // k_recipe)

joint_em:
  # EMA weight on the pooled per-state duration fit (docs/training.md §5): measured, an undamped
  # refit swung r 471 -> 38 in one M-step for a near-empty state, perturbing all 16 recipe
  # copies of it at once. 0.7 = 70% previous fit, 30% fresh.
  global_damping: 0.7

ambient_gaps:
  inject_synthetic_gaps: false   # SIL is 7.3% of frames (near-dense) -> skip per spec's audit rule
  sil_verb: "stall"
  sil_noun: "kitchen"

data:
  dataset_root: "dataset/breakfast_actions/segmentation_coarse"
  fps: 15
  n_recipes: 10
  n_unique_trials: 503   # (participant, recipe) pairs; NOT the 1712 file count (camera-view duplicates)
