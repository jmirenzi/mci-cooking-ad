# The initial dataset conditions (spec "Conditions to generate"). Defaults apply to every
# condition unless it overrides them. Time is the session index, 0-based (one recipe a session);
# the counts are the old 10 weeks / week-4 onset / 3-week ramp / 1-week blocks at 1.3 sessions a day.
defaults:
  n_persons: 8
  n_sessions: 90
  seeds: [0, 1, 2]
  onset: 36             # first drifted session
  duration: 27          # incremental ramp and gradual p(n) ramp, in sessions
  period: 9             # recurring blocks, in sessions
  delta: 0.4            # |theta1 - theta0| on each moving knob (theta0 ~ U(0.25, 0.75))
  delta_by_knob:         # healthy fine_motor theta0 ~ U(0, 0.4) is below its 0.5 repetition hinge;
    fine_motor: 0.6      # +0.6 puts every person above it

# Expanded by scripts/drift_synth/generate.py:conditions():
#   null; mix_shift_only; <knob>_<regime> for every knob x regime below;
#   pref_plus_capability; <knob>_sweep_<delta> for every sweep knob x delta (sudden).
regimes: [sudden, incremental, gradual]
knobs: [sour, sweet, salty, fatty, mise_en_place, tidy, slow, fine_motor]
extra:
  "null": {regime: none, moving: {}}
  mix_shift_only: {regime: sudden, moving: {}, mix_shift: true}
  pref_plus_capability: {regime: sudden, moving: {sour: 0.4, slow: 0.4}}
sweep:
  knobs: [sour, slow]
  deltas: [0.05, 0.1, 0.2, 0.3, 0.45]
